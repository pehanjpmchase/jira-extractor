name: Export All Jira Tickets

on:
  workflow_dispatch:
    inputs:
      project_key:
        description: "Jira project/space key (e.g. PROJ)"
        required: true
        type: string

env:
  # Add these later in: Repo > Settings > Secrets and variables > Actions
  JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}        # e.g. https://your-company.atlassian.net
  JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}    # email of the Jira account that owns the token
  JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}      # Jira API token

jobs:
  export-tickets:
    runs-on: ubuntu-latest

    steps:
      - name: Validate configuration
        run: |
          for var in JIRA_BASE_URL JIRA_USER_EMAIL JIRA_API_TOKEN; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing secret: $var"
              exit 1
            fi
          done

      - name: Export all tickets to CSV
        env:
          PROJECT_KEY: ${{ inputs.project_key }}
        run: |
          cat > export_jira.py << 'PYEOF'
          import base64
          import csv
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          base_url = os.environ["JIRA_BASE_URL"].rstrip("/")
          email = os.environ["JIRA_USER_EMAIL"]
          token = os.environ["JIRA_API_TOKEN"]
          project = os.environ["PROJECT_KEY"].strip()

          auth = base64.b64encode(f"{email}:{token}".encode()).decode()
          headers = {"Authorization": f"Basic {auth}", "Accept": "application/json"}

          jql = f'project = "{project}" ORDER BY created ASC'
          fields = "summary,status,issuetype,priority,assignee,reporter,labels,created,updated,duedate,project"

          columns = ["key", "url", "summary", "status", "type", "priority",
                     "assignee", "reporter", "labels", "created", "updated",
                     "due_date", "project"]

          def name_of(obj, attr="name", default=""):
              return (obj or {}).get(attr, default) or default

          rows = []
          next_token = None

          while True:
              params = {"jql": jql, "fields": fields, "maxResults": "100"}
              if next_token:
                  params["nextPageToken"] = next_token
              url = f"{base_url}/rest/api/3/search/jql?{urllib.parse.urlencode(params)}"
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req) as resp:
                      data = json.load(resp)
              except urllib.error.HTTPError as e:
                  print(f"::error::Jira API returned HTTP {e.code}: {e.read().decode()}")
                  sys.exit(1)

              for issue in data.get("issues", []):
                  f = issue["fields"]
                  rows.append([
                      issue["key"],
                      f"{base_url}/browse/{issue['key']}",
                      f.get("summary", ""),
                      name_of(f.get("status")),
                      name_of(f.get("issuetype")),
                      name_of(f.get("priority")),
                      name_of(f.get("assignee"), "displayName", "Unassigned"),
                      name_of(f.get("reporter"), "displayName", "Unknown"),
                      ";".join(f.get("labels") or []),
                      f.get("created", ""),
                      f.get("updated", ""),
                      f.get("duedate") or "",
                      name_of(f.get("project")),
                  ])

              print(f"Fetched {len(rows)} tickets so far...")
              next_token = data.get("nextPageToken")
              if not next_token or data.get("isLast"):
                  break

          with open("jira_tickets.csv", "w", newline="", encoding="utf-8") as fh:
              writer = csv.writer(fh)
              writer.writerow(columns)
              writer.writerows(rows)

          print(f"Done. Exported {len(rows)} tickets.")
          PYEOF

          python3 export_jira.py

      - name: Write job summary
        env:
          PROJECT_KEY: ${{ inputs.project_key }}
        run: |
          COUNT=$(( $(wc -l < jira_tickets.csv) - 1 ))
          echo "## Jira export: ${PROJECT_KEY}" >> "$GITHUB_STEP_SUMMARY"
          echo "Exported **${COUNT}** tickets to \`jira_tickets.csv\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CSV
        uses: actions/upload-artifact@v4
        with:
          name: jira-${{ inputs.project_key }}-all-tickets
          path: jira_tickets.csv
